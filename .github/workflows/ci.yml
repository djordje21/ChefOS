name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, unit tests, build, secret scan
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Public placeholders so the build can run; no real project is contacted.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check:bundle

  database:
    name: Migrations + security tests (PostgreSQL 16, clean database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:db
      - name: Security tests must detect deliberately weakened protections
        run: bash scripts/security-mutation-check.sh

  supabase:
    name: Same tests against a local Supabase stack + generated types check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.120.0 }
      - run: npm ci
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - run: npm run test:db
        env:
          CHEFOS_TEST_DB_MODE: supabase
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Generated database types are up to date
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error::src/lib/supabase/database.types.ts is out of date. Regenerate it with: npm run db:types"
            echo "----- BEGIN GENERATED database.types.ts -----"
            cat "$RUNNER_TEMP/database.types.ts"
            echo "----- END GENERATED database.types.ts -----"
            exit 1
          fi
      - if: always()
        run: supabase stop --no-backup

  e2e:
    name: End-to-end (Playwright, local Supabase stack + mail catcher)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.120.0 }
      - run: npm ci
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - name: Point the app at the local stack (local demo keys only; masked)
        run: |
          supabase status -o env > "$RUNNER_TEMP/sb.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/sb.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          KEY="$(get PUBLISHABLE_KEY)"; [ -n "$KEY" ] || KEY="$(get ANON_KEY)"
          MAIL="$(get MAILPIT_URL)"; [ -n "$MAIL" ] || MAIL="$(get INBUCKET_URL)"
          echo "::add-mask::$KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$KEY"
            echo "E2E_MAIL_URL=${MAIL:-http://127.0.0.1:54324}"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/sb.env"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
